include: ['\bstages?\b', '\bstagiaires?\b', '\binterns?\b', '\binternships?\b',
          '\bsummer analyst', '\bspring (week|insight)', '\btrainee']
exclude: ['alternan', 'apprenti', 'apprenticeship', 'work[- ]study', 'contrat pro']
locations: ["paris", "île-de-france", "ile-de-france", "la défense", "la defense", "courbevoie",
            "puteaux", "nanterre", "issy-les-moulineaux", "boulogne-billancourt", "neuilly",
            "levallois", "montrouge", "saint-denis"]
 
# HOW TO READ THE GITHUB LOG:
#   [init] X: scanned 120 links, 5 internships ...  -> works
#   [init] X: scanned 40 links, 0 internships       -> loads, but probably a generic page: needs a
#                                                      better URL (see "HOW TO FIND A GOOD URL" below)
#   [error] X ...                                   -> site blocked us or the address is wrong
#
# HOW TO FIND A GOOD URL for a firm: open its careers site in your browser, search for jobs, filter
# Contract = Internship/Stage and Location = Paris, then copy the address bar URL and paste it here.
 
sites:
  # ---------- Public institutions ----------
  - name: Caisse des Dépôts (Wizbii)
    url: https://www.wizbii.com/company/caisse-des-depots
    type: browser
    wait_ms: 7000
    scrolls: 4
    require_text: ["paris"]
  - name: Bpifrance
    url: "https://talents.bpifrance.fr/nos-opportunites/?criteres=stage%7Ccapital-investissement%7Cfinances%7Cimmobilier-et-environnement-de-travail%7Creseau-bancaire%7Caccompagnement%7Cdeal-flow%7Crisques%7Cdeveloppement-durable-rse%7Cinternational"
