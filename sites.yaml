# Titles must match one of these (whole words, so "Internal" / "International" don't count)
include: ['\bstages?\b', '\bstagiaires?\b', '\binterns?\b', '\binternships?\b',
          '\bsummer analyst', '\bspring (week|insight)', '\btrainee']
# Dropped (unless the title says "stage OR alternance", then it's kept and flagged)
exclude: ['alternan', 'apprenti', 'apprenticeship', 'work[- ]study', 'contrat pro']

# Where the job has to be. Jobs with no location info are kept.
# For scraped pages, add `require_text: ["paris"]` on a site to enforce it.
locations: ["paris", "île-de-france", "ile-de-france", "la défense", "la defense", "courbevoie",
            "puteaux", "nanterre", "issy-les-moulineaux", "boulogne-billancourt", "neuilly",
            "levallois", "montrouge", "saint-denis"]

# HOW TO USE: the URLs below are best-effort starting points that I could NOT test from my
# environment. Run `python monitor.py --test` and fix any site that errors / shows 0 links.
# BEST PRACTICE for the big bank portals: open their job search in your browser, filter
# "Internship/Stage" + "Paris", and paste THAT results URL as `url`. Then page 1 = newest jobs.
#
# type: auto (default) = plain request, falls back to a headless browser for JS-heavy pages
#       greenhouse / lever / smartrecruiters  -> token: <company slug>   (most reliable)
#       workday -> url: https://<tenant>.wdN.myworkdayjobs.com/<board>   (reliable)

sites:
  # ---------- Public institutions / state finance ----------
  - name: Caisse des Dépôts            # verified page: JobTeaser lists CDC stage/alternance offers
    url: https://www.jobteaser.com/fr/companies/caisse-des-depots/job-offers
    require_text: ["paris"]
  - name: Banque de France
    url: https://www.banque-france.fr/fr/carrieres
