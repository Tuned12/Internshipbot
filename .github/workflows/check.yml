name: check-internships
on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min (GitHub may delay it a bit)
  workflow_dispatch:
permissions:
  contents: write
concurrency: check-internships   # never run two at once
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1
      - run: playwright install --with-deps chromium
      - run: python monitor.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - name: Save state
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet && exit 0
          git commit -qm "update seen"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs -q && git push -q && exit 0
            sleep 4
          done
          echo "Could not save state after 5 tries"; exit 1
 
